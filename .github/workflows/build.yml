# Сборка игры на каждый пуш: тесты, затем .exe (Windows) и Linux-версия.
# Готовые архивы — во вкладке Actions → нужный запуск → Artifacts.
# Пуш тега v* (например v0.3) дополнительно создаёт Release с архивами.
name: Сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Шаблоны экспорта
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Импорт ресурсов
        run: godot --headless --path . --import || true

      - name: Тесты
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Экспорт
        run: |
          mkdir -p build/windows build/linux dist
          godot --headless --path . --export-release "Windows" build/windows/IAmSpellcast.exe
          godot --headless --path . --export-release "Linux" build/linux/IAmSpellcast.x86_64
          cd build/windows && zip -9 ../../dist/IAmSpellcast-windows.zip IAmSpellcast.exe && cd ../..
          cd build/linux && zip -9 ../../dist/IAmSpellcast-linux.zip IAmSpellcast.x86_64 && cd ../..
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: IAmSpellcast-windows
          path: dist/IAmSpellcast-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IAmSpellcast-linux
          path: dist/IAmSpellcast-linux.zip

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
